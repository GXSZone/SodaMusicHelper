[versions]
agp = "9.5.0"
assists = "3.5.10"
compileSdk = "36"
minSdk = "24"
targetSdk = "36"
coreKtx = "1.17.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
lifecycle = "2.11.0"
recyclerview = "1.4.0"
